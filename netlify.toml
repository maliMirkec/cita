[build]
  publish = "_site"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CLOUDINARY_CLOUD_NAME"

[functions]
  included_files = ["src/**", "designer.config.json", ".designer/**"]

[[edge_functions]]
  path = "/og-image"
  function = "og-image"

# Language-based redirects for root path
# Croatian users get redirected to /hr/
[[redirects]]
  from = "/"
  to = "/hr/"
  status = 302
  force = true
  conditions = {Language = ["hr"]}

# Everyone else gets English (fallback)
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
